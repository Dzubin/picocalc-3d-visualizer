# Builds the Linux binary on GitHub's Ubuntu runner, bundles the SDL2 shared
# library next to it, zips the two together, and attaches the zip to a release.
# Run it by hand: Actions tab -> "Linux build" -> Run workflow.
name: Linux build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip to
        default: V1.0RC1

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04 (older glibc) so the binary runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package binary + SDL2 library
        run: |
          mkdir pkg
          cp build/3d-visualizer-linux pkg/
          SDL_LIB=$(ldd build/3d-visualizer-linux | awk '/libSDL2-2.0.so.0/ {print $3}')
          cp -L "$SDL_LIB" pkg/libSDL2-2.0.so.0
          cp /usr/share/doc/libsdl2-2.0-0/copyright pkg/SDL2-LICENSE.txt
          cp LICENSE pkg/LICENSE
          cat > pkg/README.txt <<'TXT'
          PicoCalc 3D Visualizer - Linux build
          https://github.com/Dzubin/picocalc-3d-visualizer

          Unzip, then run:   ./3d-visualizer-linux

          libSDL2-2.0.so.0 (SDL2, zlib license - see SDL2-LICENSE.txt) sits next to
          the program and is found automatically; nothing needs installing. You
          need a desktop with X11 or Wayland.

          Controls: arrow keys orbit, F1/F2 zoom, H toggles hidden-line removal,
          ESC quits.
          TXT
          # The binary must pick up the bundled SDL2, not a system copy.
          ldd pkg/3d-visualizer-linux | grep -i sdl2
          ldd pkg/3d-visualizer-linux | grep -i sdl2 | grep -q "pkg/libSDL2"
          (cd pkg && zip -r ../3d-visualizer-linux.zip .)
          unzip -l 3d-visualizer-linux.zip

      - uses: actions/upload-artifact@v4
        with:
          name: 3d-visualizer-linux
          path: 3d-visualizer-linux.zip

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" 3d-visualizer-linux.zip --clobber
